name: manhole-settlement
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-manhole-settlement}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-municipal_ops}
      POSTGRES_USER: ${POSTGRES_USER:-municipal_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-municipal_ops_local}
    ports:
      - "127.0.0.1:${DB_PORT:-17769}:5432"
    volumes:
      - manhole_settlement_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-manhole-settlement}-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - manhole_settlement_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-manhole-settlement}-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://municipal_ops:municipal_ops_local@db:5432/municipal_ops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-manhole-settlement-local-secret}
      SEED_DEMO: ${SEED_DEMO:-true}
      SHARED_DIR: /shared
    ports:
      - "127.0.0.1:${BACKEND_PORT:-19269}:8000"
    volumes:
      - manhole_settlement_shared:/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-manhole-settlement}-worker
    command: ["python", "-m", "src.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://municipal_ops:municipal_ops_local@db:5432/municipal_ops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SHARED_DIR: /shared
    volumes:
      - manhole_settlement_shared:/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; p=Path('/shared/worker-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime < 15"]
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-manhole-settlement}-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18269}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  manhole_settlement_db:
    name: manhole-settlement-db
  manhole_settlement_redis:
    name: manhole-settlement-redis
  manhole_settlement_shared:
    name: manhole-settlement-shared
